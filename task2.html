<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Transfer Kanban</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/task2.js" defer></script>
</head>
<body class="py-4">
    <div class="container-fluid px-4">
        <h2 class="text-center text-emerald fw-bold mb-3">Kanban Board</h2>
        
        <input type="text" id="filter-input" class="form-control custom-input mb-3" placeholder="Поиск игрока...">
        <div id="alert-msg" class="alert alert-warning d-none"></div>

        <div class="row g-3">
            <div class="col-12 col-md-4">
                <div class="card custom-card p-3">
                    <h5 class="text-warning">Слухи</h5>
                    <div id="col-todo"></div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card custom-card p-3">
                    <h5 class="text-emerald">Переговоры (Макс 3)</h5>
                    <div id="col-progress"></div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card custom-card p-3">
                    <h5 class="text-success">Официально</h5>
                    <div id="col-done"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
